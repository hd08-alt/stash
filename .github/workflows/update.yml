name: Fetch articles and publish

on:
  schedule:
    - cron: '17 6 * * *'   # every day at 06:17 UTC; change to suit your mornings
  workflow_dispatch:         # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths-ignore: ['public/data/**', '**.md']

permissions:
  contents: write   # commit the day's articles back to the repo
  pages: write
  id-token: write

concurrency:
  group: stash-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Fetch feeds
        run: npm run fetch

      - name: Save new articles to the repo
        run: |
          git config user.name "stash-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No new articles."
          else
            git commit -m "Articles for $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
